<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateFlow</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f6f7f9;color:#111827}.shell{display:flex;min-height:100vh}.side{width:220px;background:#111827;color:#fff;padding:24px 14px;position:fixed;height:100vh}.brand{font-size:23px;font-weight:800;padding:8px 10px 28px}.nav button{width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#374151;color:#fff}.main{margin-left:220px;padding:34px;flex:1}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:30px;font-weight:800}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:800;margin-top:8px}.btn{border:0;border-radius:9px;padding:11px 16px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:#111827;border:1px solid #e5e7eb}.input{padding:12px;border:1px solid #e5e7eb;border-radius:9px;background:#fff;width:100%}.toolbar{margin:18px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid #eee;text-align:left}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;padding:22px;border-radius:16px;width:min(600px,100%)}.field{margin:10px 0}.field label{display:block;font-weight:700;color:#6b7280;margin-bottom:5px}.actions{text-align:right;margin-top:18px}@media(max-width:700px){.side{width:65px}.brand{font-size:0}.brand:after{content:"EF";font-size:20px}.nav button{font-size:0;text-align:center}.main{margin-left:65px;padding:20px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style></head><body><div id="root"></div><script src="app.js"></script></body></html>
